helm:
  repo: https://suse-edge.github.io/charts
  chart: cdi
  version: 0.5.0
  releaseName: cdi
  targetNamespace: cdi
  takeOwnership: true
  values:
    config:
      featureGates: "HonorWaitForFirstConsumer"

# We move the instructions to the target level to be more explicit

  # This is the "Magic" block that silences the Modified error
  template:
    diff:
      comparePatches:
      - kind: Role
        name: cdi-operator
        namespace: default
        operations:
        - {"op": "remove", "path": "/metadata/labels"}
      - kind: RoleBinding
        name: cdi-operator
        namespace: default
        operations:
        - {"op": "remove", "path": "/metadata/labels"}
